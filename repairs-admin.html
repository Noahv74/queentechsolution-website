<style>

:root{
  --bg:#131210; --bg-2:#1A1916; --surface:#201E1A; --surface-2:#2A2722;
  --ink:#EFE8DB; --muted:#A79E8F; --dim:#6E675C; --line:#36322B; --line-2:#4A443A;
  --gold:#E2A63F; --gold-2:#F3C877; --gold-soft:rgba(226,166,63,.12);
  --red:#E25B45; --wa:#2FA866;
  --f-display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
h1,h2,h3{margin:0;font-family:var(--f-display);line-height:.95;text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
h2{font-size:clamp(2rem,4.4vw,3.2rem);font-weight:800}
h3{font-size:1.35rem;font-weight:800}
p{margin:0}
[hidden]{display:none!important}
.tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:inline-flex;align-items:center;gap:10px}
.tag::before{content:"";width:22px;height:1px;background:currentColor}
.muted{color:var(--muted)}
.hint{font-size:.84rem;color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 18px;border-radius:4px;font:600 .92rem/1 var(--f-body);text-decoration:none;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--bg)}.btn-gold:hover{background:var(--gold-2)}
.btn-line{border-color:var(--line-2);color:var(--ink);background:transparent}.btn-line:hover{border-color:var(--gold);color:var(--gold-2)}
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:24px;min-height:66px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-right:auto;flex:none}
.crown{width:34px;height:34px;flex:none}
.brand b{display:block;font:900 1.3rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font:500 .58rem/1.4 var(--f-mono);letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-top:3px;white-space:nowrap}
.links{display:flex;gap:24px;align-items:center}
.links a:not(.btn){color:var(--muted);text-decoration:none;font-weight:500;font-size:.92rem;white-space:nowrap}
.links a:not(.btn):hover{color:var(--ink)}
@media (max-width:820px){.links a.hide-sm{display:none}}
@media (max-width:420px){.brand small{display:none}.links .btn{padding:10px 12px;font-size:.82rem}}
.jump{display:flex;gap:0;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.jump a{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:12px 16px;white-space:nowrap}
.jump a b{color:var(--gold);font-weight:500;margin-right:6px}
.jump a:hover{color:var(--ink)}
.phead{padding-block:clamp(32px,5vw,60px) 10px}
.phead h1{font-size:clamp(2.8rem,7vw,5.4rem);font-weight:900;line-height:.9;margin:16px 0 14px}
.phead h1 em{font-style:normal;color:var(--gold)}
.phead p{max-width:62ch;color:var(--muted);font-size:1.05rem}
.quick{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.sec{padding-block:clamp(40px,6vw,64px);border-bottom:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head .tag{display:flex;margin-bottom:12px}
.sec-head p{max-width:56ch;color:var(--muted);font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:clamp(16px,2.6vw,26px)}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font:500 .66rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line-2);background:var(--bg-2)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)}
.mono{font-family:var(--f-mono);font-size:.86rem}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* FixTrack */
.tform{display:flex;gap:10px;margin-top:22px;max-width:560px}
.tform input{flex:1;min-width:0;font:600 1.3rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:14px 16px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink)}
.tform input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.tcard{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:clamp(16px,3vw,26px);margin:16px 0;display:grid;gap:14px}
.tcard h2{font-size:clamp(1.6rem,4vw,2.3rem)}
.thead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.k{display:block;font:500 .68rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.code{font-family:var(--f-mono);font-size:1.05rem;letter-spacing:.06em;color:var(--gold-2)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.facts div{background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.facts span{display:block;font-size:.78rem;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.steps li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:16px;top:32px;bottom:0;width:2px;background:var(--line-2)}
.steps li.done:not(:last-child)::after{background:var(--gold)}
.steps i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 .85rem var(--f-mono);border:2px solid var(--line-2);color:var(--dim);background:var(--bg)}
.steps li.done i{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.steps li.now i{border-color:var(--gold);color:var(--gold-2);box-shadow:0 0 0 5px var(--gold-soft);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(226,166,63,.06)}}
.steps b{display:block;padding-top:5px}
.steps li:not(.done):not(.now) b{color:var(--dim)}
.steps small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.steps time{display:block;font:500 .74rem var(--f-mono);color:var(--dim);margin-top:2px}
.note{border-inline-start:3px solid var(--gold);background:var(--bg-2);padding:10px 14px;border-radius:4px;display:grid;gap:8px}
.note.ok{border-color:var(--wa)}
.quote{border:1px solid var(--gold);border-radius:8px;padding:14px;background:linear-gradient(135deg,rgba(226,166,63,.12),transparent);display:grid;gap:8px}
.quote b{font:800 1.8rem var(--f-display)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-wa{background:var(--wa);color:#fff}
.upd{font-size:.8rem;color:var(--dim)}
.ask{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:6px;padding:20px 22px;background:var(--bg-2);margin:20px 0}
.ask p{color:var(--muted)}.ask b{color:var(--ink)}
.spin{width:28px;height:28px;border:3px solid var(--line-2);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:var(--muted)}
/* admin */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.grid .wide{grid-column:1/-1}
.grid label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.grid input,.grid select{font:inherit;font-size:.95rem;padding:9px 10px;border:1px solid var(--line-2);border-radius:5px;background:var(--bg-2);color:var(--ink)}
.newr summary{cursor:pointer;list-style:none}.newr summary::-webkit-details-marker{display:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:999px;border:1px solid var(--line-2);font-weight:600;font-size:.88rem}
.tabs button[aria-pressed=true]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.tabs input{flex:1;min-width:180px;font:inherit;padding:7px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.stagebar{display:flex;flex-wrap:wrap;gap:6px}
.stagebar button{all:unset;cursor:pointer;font-size:.8rem;font-weight:600;padding:6px 10px;border-radius:6px;border:1px solid var(--line-2);color:var(--muted)}
.stagebar button.past{color:var(--gold-2);border-color:rgba(226,166,63,.4)}
.stagebar button[aria-pressed=true]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.msg{font-size:.85rem;color:var(--gold-2)}
html.rtl .tform input{direction:ltr}
footer{padding-block:28px 40px;color:var(--dim);font:500 .74rem var(--f-mono)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap nav">
    <a class="brand" href="/" aria-label="Queen Tech Solutions home">
      <svg class="crown" viewBox="0 0 36 36" aria-hidden="true"><rect x=".5" y=".5" width="35" height="35" rx="5" fill="none" stroke="var(--gold)"/><path d="M8 23.5 L9.6 12.5 L14.4 17.6 L18 10 L21.6 17.6 L26.4 12.5 L28 23.5 Z" fill="var(--gold)"/><rect x="8" y="25.2" width="20" height="2.4" rx="1" fill="var(--gold)"/></svg>
      <span><b>Queen Tech</b><small>FixTrack · admin</small></span>
    </a>
    <nav class="links" aria-label="Main"><a class="btn btn-line" href="/track.html">Customer view</a></nav>
  </div>
</header>
<main class="wrap" translate="no">
  <section class="phead"><span class="tag">FixTrack · Admin</span><h1>Repairs <em>board.</em></h1></section>
  <div id="gate" class="tcard"><div class="spin"></div></div>
  <div id="app" hidden>
    <details class="tcard newr" id="newbox" open>
      <summary><b>+ New repair</b></summary>
      <form id="nf" class="grid" autocomplete="off">
        <label>Customer name<input name="name" required></label>
        <label>Mobile / WhatsApp<input name="phone" type="tel" placeholder="05x xxx xxxx" required></label>
        <label>Device<input name="device" placeholder="HP laptop, TP-Link router, Hikvision NVR…" required></label>
        <label>Problem<input name="issue" placeholder="No power, slow, no recording…"></label>
        <label>Expected ready<input name="eta" placeholder="Tomorrow evening"></label>
        <label>Customer language<select name="lang"><option value="en">English</option><option value="ar">العربية</option></select></label>
        <label class="wide">Private notes (only you see these)<input name="notes" placeholder="Password, accessories received, charger…"></label>
        <div class="wide row"><button class="btn btn-gold" type="submit">Create repair + WhatsApp the customer</button><span class="msg" id="nmsg"></span></div>
      </form>
    </details>
    <div class="tabs" id="tabs"><button data-f="active" aria-pressed="true">Active</button><button data-f="ready" aria-pressed="false">Ready</button><button data-f="done" aria-pressed="false">Collected</button><button data-f="all" aria-pressed="false">All</button><input id="qf" placeholder="Search name, code, device"></div>
    <div id="list"></div>
  </div>
</main>
<script type="module">
import { firebase } from "/qt-auth.js";
import { isAdmin, listRepairs, getPrivate, createRepair, updateRepair, deleteRepair, STAGES } from "/qt-repairs.js";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ST = ["Received", "Diagnosing", "Waiting for approval", "Repairing", "Ready"];
const MSG = {
  en: [
    (r, u) => `Hello ${r.first}, Queen Tech here. We received your ${r.device}. Repair code: ${r.code}\nTrack it any time: ${u}`,
    (r, u) => `Hello ${r.first}, we're checking your ${r.device} now. We'll tell you the fault and the price soon.\nTrack: ${u}`,
    (r, u) => `Hello ${r.first}, we found the problem with your ${r.device}.${r.note ? "\n" + r.note : ""}${r.quote != null && r.quote !== "" ? "\nPrice: AED " + r.quote : ""}\nPlease approve on WhatsApp or here: ${u}`,
    (r, u) => `Hello ${r.first}, thanks for approving. We're repairing your ${r.device} now.${r.eta ? "\nExpected: " + r.eta : ""}\nTrack: ${u}`,
    (r, u) => `Good news ${r.first}! Your ${r.device} is ready. Reply with a good time and we'll bring it back to you.${r.quote != null && r.quote !== "" ? "\nTotal: AED " + r.quote : ""}\n${u}`
  ],
  ar: [
    (r, u) => `أهلاً ${r.first}، معاك كوين تك. استلمنا جهازك (${r.device}). كود الإصلاح: ${r.code}\nتابع حالته في أي وقت: ${u}`,
    (r, u) => `أهلاً ${r.first}، بنفحص جهازك (${r.device}) دلوقتي، وهنبلغك بالعطل والسعر قريب.\nتابع: ${u}`,
    (r, u) => `أهلاً ${r.first}، عرفنا مشكلة جهازك (${r.device}).${r.note ? "\n" + r.note : ""}${r.quote != null && r.quote !== "" ? "\nالسعر: " + r.quote + " درهم" : ""}\nوافق على واتساب أو من هنا: ${u}`,
    (r, u) => `أهلاً ${r.first}، شكراً على الموافقة. بنصلّح جهازك (${r.device}) دلوقتي.${r.eta ? "\nالموعد المتوقع: " + r.eta : ""}\nتابع: ${u}`,
    (r, u) => `خبر حلو يا ${r.first}! جهازك (${r.device}) جاهز. رد علينا بالوقت المناسب وهنوصّله لك.${r.quote != null && r.quote !== "" ? "\nالإجمالي: " + r.quote + " درهم" : ""}\n${u}`
  ]
};
function phoneIntl(p) { let d = String(p || "").replace(/\D/g, ""); if (d.startsWith("00")) d = d.slice(2); if (d.startsWith("0")) d = "971" + d.slice(1); if (/^5\d{8}$/.test(d)) d = "971" + d; return d; }
function link(r) { return location.origin + "/track.html?c=" + r.code + (r.lang === "ar" ? "&lang=ar" : ""); }
function waUpdate(r, priv) { const m = (MSG[r.lang] || MSG.en)[Math.min(4, r.stage || 0)](r, link(r)); return "https://wa.me/" + phoneIntl(priv.phone) + "?text=" + encodeURIComponent(m); }
const when = t => t ? new Date(t).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
let items = [], privs = {}, filt = "active";

function reviewWa(r, priv) {
  const u = location.origin + "/reviews.html?write=1&job=" + r.code + (r.lang === "ar" ? "&lang=ar" : "");
  const m = r.lang === "ar" ? `أهلاً ${r.first}، شكراً إنك اخترت كوين تك! ممكن تكتب رأيك في شغلنا في دقيقة؟ رأيك بيفرق معانا ومع العملاء الجداد:\n${u}`
                            : `Hello ${r.first}, thank you for choosing Queen Tech! Could you take a minute to tell us how we did? It really helps us and new customers:\n${u}`;
  return "https://wa.me/" + phoneIntl(priv.phone) + "?text=" + encodeURIComponent(m);
}
function payWa(r, priv) {
  const u = location.origin + "/pay.html?repair=" + r.code + (r.lang === "ar" ? "&lang=ar" : "");
  const amt = "AED " + Number(String(r.quote).replace(/[^0-9.]/g, "")).toLocaleString("en-US");
  const m = r.lang === "ar" ? `أهلاً ${r.first}، معاك كوين تك. تقدر تدفع تمن إصلاح جهازك (${amt}) أونلاين بالكارت من اللينك ده:\n${u}`
                            : `Hello ${r.first}, Queen Tech here. You can pay for your repair (${amt}) online by card here:\n${u}`;
  return "https://wa.me/" + phoneIntl(priv.phone) + "?text=" + encodeURIComponent(m);
}
function card(r) {
  const p = privs[r.code] || {};
  return `<div class="tcard rep" data-c="${esc(r.code)}">
    <div class="thead"><div><b class="code">${esc(r.code)}</b> · <b>${esc(p.name || r.first)}</b> <span class="muted">${esc(p.phone || "")}</span><div class="muted">${esc(r.device)}${r.issue ? " · " + esc(r.issue) : ""} · updated ${esc(when(r.updated))}</div></div>
      <div class="row"><a class="btn btn-wa" target="_blank" rel="noopener" href="${esc(waUpdate(r, p))}">WhatsApp update</a><button class="btn btn-line" data-copy>Copy link</button><a class="btn btn-line" target="_blank" rel="noopener" href="${esc(reviewWa(r, p))}">⭐ Ask for review</a>${(window.QT_SITE || {}).payEndpoint && r.quote != null && r.quote !== "" && !r.collected ? `<a class="btn btn-line" target="_blank" rel="noopener" href="${esc(payWa(r, p))}">💳 Send pay link</a>` : ""}</div></div>
    <div class="stagebar">${ST.map((s, i) => `<button data-stage="${i}" aria-pressed="${i === (r.stage || 0) && !r.collected}" class="${i < (r.stage || 0) || r.collected ? "past" : ""}">${i + 1}. ${s}</button>`).join("")}<button data-collect aria-pressed="${!!r.collected}">✓ Collected</button></div>
    <div class="grid">
      <label>Note for the customer<input data-f="note" value="${esc(r.note || "")}" placeholder="e.g. Hard disk failed, needs replacing"></label>
      <label>Price (AED)<input data-f="quote" type="number" min="0" step="1" value="${r.quote == null ? "" : esc(r.quote)}"></label>
      <label>Expected ready<input data-f="eta" value="${esc(r.eta || "")}"></label>
      <label>Private notes<input data-p="notes" value="${esc(p.notes || "")}"></label>
      <div class="wide row"><button class="btn btn-gold" data-save>Save</button><button class="btn btn-line" data-del>Delete</button><span class="msg" data-msg></span></div>
    </div></div>`;
}
function show() {
  const q = $("qf").value.trim().toLowerCase();
  const list = items.filter(r => filt === "all" || (filt === "done" ? r.collected : filt === "ready" ? !r.collected && r.stage === 4 : !r.collected && r.stage < 4))
    .filter(r => !q || [r.code, r.first, r.device, r.issue, (privs[r.code] || {}).name, (privs[r.code] || {}).phone].join(" ").toLowerCase().includes(q));
  $("list").innerHTML = list.length ? list.map(card).join("") : '<div class="tcard muted">No repairs here.</div>';
}
async function load() {
  items = await listRepairs(200);
  await Promise.all(items.map(async r => { if (!privs[r.code]) privs[r.code] = await getPrivate(r.code).catch(() => ({})); }));
  show();
}
$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (!b) return; filt = b.getAttribute("data-f"); document.querySelectorAll("#tabs [data-f]").forEach(x => x.setAttribute("aria-pressed", x === b)); show(); });
$("qf").addEventListener("input", show);
$("list").addEventListener("click", async e => {
  const el = e.target.closest(".rep"); if (!el) return; const code = el.getAttribute("data-c"), r = items.find(x => x.code === code); if (!r) return;
  const msg = t => { el.querySelector("[data-msg]").textContent = t; };
  try {
    if (e.target.closest("[data-copy]")) { await navigator.clipboard.writeText(link(r)).catch(() => prompt("", link(r))); msg("Link copied"); return; }
    const sb = e.target.closest("[data-stage]");
    if (sb) { const s = +sb.getAttribute("data-stage"); await updateRepair(code, { stage: s, collected: false }); r.stage = s; r.collected = false; r.times = Object.assign({}, r.times, { [s]: Date.now() }); r.updated = Date.now(); show(); return; }
    if (e.target.closest("[data-collect]")) { await updateRepair(code, { collected: !r.collected }); r.collected = !r.collected; r.updated = Date.now(); show(); return; }
    if (e.target.closest("[data-save]")) {
      const v = f => el.querySelector(`[data-f="${f}"]`).value.trim(), qv = v("quote");
      const patch = { note: v("note"), quote: qv === "" ? null : Number(qv), eta: v("eta") }, priv = { notes: el.querySelector('[data-p="notes"]').value.trim() };
      await updateRepair(code, patch, priv); Object.assign(r, patch, { updated: Date.now() }); privs[code] = Object.assign({}, privs[code], priv); show();
      document.querySelector(`.rep[data-c="${code}"] [data-msg]`).textContent = "Saved. Now press WhatsApp update to tell the customer."; return;
    }
    if (e.target.closest("[data-del]")) { if (!confirm("Delete repair " + code + "? The customer's link will stop working.")) return; await deleteRepair(code); items = items.filter(x => x.code !== code); show(); }
  } catch (err) { msg("Couldn't save: " + (err.code || err.message)); }
});
$("nf").addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target, v = n => f.elements[n].value.trim();
  if (phoneIntl(v("phone")).length < 11) { $("nmsg").textContent = "Check the mobile number."; return; }
  $("nmsg").textContent = "Creating…";
  try {
    const name = v("name"), r = await createRepair({ first: name.split(/\s+/)[0], device: v("device"), issue: v("issue"), eta: v("eta"), lang: v("lang") }, { name, phone: v("phone"), notes: v("notes") });
    privs[r.code] = { name, phone: v("phone"), notes: v("notes") }; items.unshift(r); f.reset(); show();
    $("nmsg").innerHTML = 'Created <b>' + esc(r.code) + '</b>. ';
    window.open(waUpdate(r, privs[r.code]), "_blank", "noopener");
  } catch (err) { $("nmsg").textContent = "Couldn't create: " + (err.code || err.message); }
});
const fb = await firebase();
fb.onAuthStateChanged(fb.auth, async u => {
  if (!u) { $("gate").innerHTML = '<h2>Sign in</h2><p>Sign in with your Queen Tech account to manage repairs.</p><a class="btn btn-gold" href="/account.html?next=/repairs-admin.html">Sign in</a>'; return; }
  let ok = false, why = "";
  try { ok = await isAdmin(u.uid); } catch (err) { why = err.code || err.message; }
  if (!ok) {
    $("gate").innerHTML = '<h2>Not an admin yet</h2><p>Signed in as <b>' + esc(u.email) + '</b>. To make this account an admin, open the Firebase console → Firestore Database → start a collection <b>admins</b> → Document ID:</p><p><code class="code">' + esc(u.uid) + '</code></p><p>(add any field, e.g. <code>name</code> = Noah) and reload this page.</p>' + (why ? '<p class="muted">Details: ' + esc(why) + ' — if this says the database was not found, create the Firestore database first.</p>' : '');
    return;
  }
  $("gate").hidden = true; $("app").hidden = false;
  try { await load(); } catch (err) { $("list").innerHTML = '<div class="tcard">Couldn\'t load repairs: ' + esc(err.code || err.message) + '</div>'; }
});
</script>
