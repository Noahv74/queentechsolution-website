# Queen Tech AI assistant backend (Cloudflare Worker)
# Deploy:  npx wrangler deploy        (from this ai-worker folder)
# Secret:  npx wrangler secret put ANTHROPIC_API_KEY
name = "queentech-ai"
main = "worker.js"
compatibility_date = "2025-09-27"

[vars]
MODEL = "claude-haiku-5-5"
ALLOWED_ORIGINS = "https://queentechsolution.info,https://www.queentechsolution.info"
MAX_PER_HOUR = "30"
PRICE_MODEL = "claude-haiku-5-5"   # model for the بكام؟ price search
PRICE_SEARCHES = "6"               # web searches per price lookup (cost control)
PRICE_CACHE_SECONDS = "21600"      # same search reuses the answer for 6 hours
