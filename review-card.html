<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Review cards to print | Queen Tech</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--gold:#E2A63F;--ink:#131210}
*{box-sizing:border-box}
body{margin:0;background:#2a2723;color:#eee;font-family:Figtree,Arial,sans-serif}
.bar{max-width:210mm;margin:0 auto;padding:18px 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.bar h1{font:900 22px/1.1 "Big Shoulders Display",sans-serif;letter-spacing:.03em;margin:0;text-transform:uppercase}
.bar p{margin:4px 0 0;color:#bbb;font-size:14px;max-width:62ch}
.bar button{font:700 15px Figtree,sans-serif;background:var(--gold);color:var(--ink);border:0;border-radius:6px;padding:12px 18px;cursor:pointer}
.sheet{width:210mm;min-height:297mm;margin:0 auto 30px;background:#fff;padding:10mm 10mm;display:grid;grid-template-columns:repeat(2,85mm);grid-auto-rows:55mm;gap:6mm 10mm;justify-content:center;align-content:start}
.card{width:85mm;height:55mm;background:var(--ink);color:#F2ECE0;border-radius:3mm;display:grid;grid-template-columns:1fr 31mm;gap:3mm;padding:4.5mm;overflow:hidden;position:relative}
.card .l{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.brand{display:flex;align-items:center;gap:2mm}
.brand svg{width:6.5mm;height:6.5mm}
.brand b{font:900 4.6mm/1 "Big Shoulders Display",sans-serif;letter-spacing:.04em}
.h{font:800 4.4mm/1.1 "Big Shoulders Display",sans-serif;text-transform:uppercase;letter-spacing:.02em;color:var(--gold);margin-top:2mm}
.t{font-size:2.65mm;line-height:1.35;color:#d8d0c2}
.ar{font-family:"IBM Plex Sans Arabic",sans-serif;direction:rtl;text-align:right;font-size:2.7mm;line-height:1.4;color:#d8d0c2}
.ar strong{color:var(--gold);font-weight:700;font-size:3.1mm}
.f{font:500 2.35mm "JetBrains Mono",monospace;color:#a69e8e;letter-spacing:.02em}
.qr{background:#fff;border-radius:2mm;padding:2mm;align-self:center;display:grid;gap:1mm;justify-items:center}
.qr svg{width:27mm;height:27mm;display:block}
.qr span{font:700 2.2mm Figtree,sans-serif;color:var(--ink);letter-spacing:.02em}
.stars{color:var(--gold);font-size:3mm;letter-spacing:.6mm}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .bar{display:none}
  .sheet{margin:0}
  .card{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar">
  <div>
    <h1>Google review cards</h1>
    <p>10 cards per A4 sheet (85 × 55 mm, business-card size). Print in colour, cut, and hand one to every customer when the job is done. Ask every customer, not only the happy ones: Google doesn't allow picking who gets asked or giving rewards for reviews.</p>
  </div>
  <button type="button" onclick="window.print()">Print</button>
</div>
<div class="sheet" id="sheet"></div>
<script src="/site-config.js"></script>
<script src="/vendor/qrcode.js"></script>
<script>
(function () {
  var url = (window.QT_SITE && window.QT_SITE.reviewUrl) || "https://g.page/r/CXPWAzSYn864ECE/review";
  var q = qrcode(0, "M"); q.addData(url); q.make();
  var svg = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  var crown = '<svg viewBox="0 0 36 36" aria-hidden="true"><rect x=".5" y=".5" width="35" height="35" rx="5" fill="none" stroke="#E2A63F"/><path d="M8 23.5 L9.6 12.5 L14.4 17.6 L18 10 L21.6 17.6 L26.4 12.5 L28 23.5 Z" fill="#E2A63F"/><rect x="8" y="25.2" width="20" height="2.4" rx="1" fill="#E2A63F"/></svg>';
  var card = '<div class="card"><div class="l">' +
    '<div><div class="brand">' + crown + '<b>QUEEN TECH</b></div>' +
    '<div class="h">How did we do?</div>' +
    '<div class="t">Scan and tell others on Google. It takes 30 seconds and helps a small local business a lot.</div></div>' +
    '<div class="ar"><strong>كيف كانت خدمتنا؟</strong><br>امسح الرمز وشارك رأيك على جوجل.</div>' +
    '<div class="f">+971 55 797 1520 · queentechsolution.info</div>' +
    '</div><div class="qr">' + svg + '<span>Google review</span></div></div>';
  document.getElementById("sheet").innerHTML = new Array(11).join(card);
})();
</script>
</body>
</html>
