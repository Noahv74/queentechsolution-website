# Builds the Queen Tech Android app (unsigned). Signing is done offline with the upload key.
name: Android app build
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build unsigned APK and AAB
        id: build
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease 2>&1 | tee /tmp/build.log
      - name: Publish outputs to the android-dist branch
        if: always()
        run: |
          mkdir -p /tmp/dist
          cp /tmp/build.log /tmp/dist/ 2>/dev/null || true
          cp android/app/build/outputs/apk/release/*.apk /tmp/dist/ 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/*.aab /tmp/dist/ 2>/dev/null || true
          cd /tmp/dist
          { echo "status=${{ steps.build.outcome }}"; echo "commit=$GITHUB_SHA"; date -u; ls -la; } > build-info.txt
          git init -q -b android-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Android build ${{ steps.build.outcome }} for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-dist
